<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Surge Portable</title>
  <link rel="icon" href="assets/surge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/argon2.umd.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>

  <div id="usb-banner" class="banner banner-error banner-fixed" role="alert" hidden></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-text">
          <strong>SURGE</strong>
          <small>PORTABLE WORKSPACE</small>
        </span>
      </div>
      <div class="topbar-status">
        <span id="usb-chip" class="chip chip-quiet">Checking USB…</span>
        <div id="storage" class="storage" hidden>
          <div class="storage-text">
            <span id="storage-label">USB storage</span>
            <span id="storage-value"></span>
          </div>
          <div class="storage-track" role="img" aria-labelledby="storage-label">
            <div id="storage-fill" class="storage-fill"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="shell-body">
      <nav class="rail" aria-label="Workspace sections">
        <ul id="nav-list" class="nav-list"></ul>
        <div class="rail-footer">
          <span>SURGE PORTABLE 1.0</span>
          <span>16GB EDITION</span>
        </div>
      </nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
