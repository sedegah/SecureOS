<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Surge</title>
  <link rel="icon" href="assets/surge.png" type="image/png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/argon2.umd.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body class="is-booting">
  <a class="skip-link" href="#main">Skip to workspace</a>

  <div class="app">
    <header class="titlebar">
      <img src="assets/surge.png" alt="Surge Logo" class="titlebar-logo">
      <span class="titlebar-name">Surge</span>
      <span class="titlebar-section" id="titlebar-section">Home</span>
    </header>

    <div id="usb-banner" class="banner banner-error banner-fixed" role="alert" hidden></div>
    <div id="space-banner" class="banner banner-warn banner-fixed" role="status" hidden></div>

    <div class="shell">
      <nav class="rail" aria-label="Workspace sections">
        <p class="pane-caption">Workspace</p>
        <ul id="nav-list" class="nav-list"></ul>
      </nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <footer class="statusbar">
      <span id="usb-chip" class="chip chip-quiet">Checking USB…</span>
      <div id="storage" class="storage" hidden>
        <span class="storage-label" id="storage-label">USB</span>
        <div class="storage-track" role="img" aria-labelledby="storage-label">
          <div id="storage-fill" class="storage-fill"></div>
        </div>
        <span id="storage-value" class="storage-value"></span>
      </div>
      <span id="status-clock" class="statusbar-clock"></span>
    </footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
