<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Surge Browser</title>
  <link rel="stylesheet" href="browser.css">
  <script src="browser.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-add" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>
    <symbol id="icon-close" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></symbol>
    <symbol id="icon-back" viewBox="0 0 20 20"><path d="m9 4-6 6 6 6M3 10h14"/></symbol>
    <symbol id="icon-forward" viewBox="0 0 20 20"><path d="m11 4 6 6-6 6M3 10h14"/></symbol>
    <symbol id="icon-reload" viewBox="0 0 20 20"><path d="M16 8a6 6 0 1 0 0 5M16 3v5h-5"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 20 20"><path d="M5 5h10v10H5z"/></symbol>
    <symbol id="icon-bookmark" viewBox="0 0 20 20"><path d="M5 3h10v14l-5-3-5 3z"/></symbol>
    <symbol id="icon-workspace" viewBox="0 0 20 20"><path d="M2 5h6l2 2h8v10H2zM2 5V3h6l2 2h7v2"/></symbol>
    <symbol id="icon-download" viewBox="0 0 20 20"><path d="M10 2v11m-4-4 4 4 4-4M3 13v4h14v-4"/></symbol>
    <symbol id="icon-search" viewBox="0 0 20 20"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5"/></symbol>
  </svg>

  <header class="browser-chrome" aria-label="Browser controls">
    <div class="tab-strip">
      <div id="tab-list" class="tab-list" role="tablist" aria-label="Browser tabs"></div>
      <button id="new-tab" class="icon-button new-tab" type="button" title="New tab (Ctrl+T)" aria-label="New tab" disabled>
        <svg class="icon" aria-hidden="true"><use href="#icon-add"/></svg>
      </button>
    </div>
    <div class="toolbar">
      <div class="toolbar-actions">
        <div class="navigation-controls" role="group" aria-label="Navigation">
          <button id="back" class="icon-button" type="button" title="Back (Alt+Left)" aria-label="Back" disabled><svg class="icon" aria-hidden="true"><use href="#icon-back"/></svg></button>
          <button id="forward" class="icon-button" type="button" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg class="icon" aria-hidden="true"><use href="#icon-forward"/></svg></button>
          <button id="reload-stop" class="icon-button" type="button" title="Reload (Ctrl+R)" aria-label="Reload" disabled><svg class="icon" aria-hidden="true"><use id="reload-icon" href="#icon-reload"/></svg></button>
        </div>
        <form id="address-form" class="address-form" role="search" aria-label="Address navigation">
          <label class="visually-hidden" for="address">Address or search</label>
          <input id="address" type="text" placeholder="Enter an address or search" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
          <button id="go" type="submit" title="Go to address" disabled>Go</button>
        </form>
        <button id="bookmark" class="icon-button" type="button" title="Bookmark this page" aria-label="Bookmark this page" disabled><svg class="icon" aria-hidden="true"><use href="#icon-bookmark"/></svg></button>
        <button id="workspace" class="utility-button" type="button" title="Open workspace" aria-label="Open workspace" disabled><svg class="icon" aria-hidden="true"><use href="#icon-workspace"/></svg><span class="utility-label">Workspace</span></button>
        <button id="downloads" class="utility-button" type="button" title="Open downloads" aria-label="Open downloads" disabled><svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg><span class="utility-label">Downloads</span><span id="download-count" class="download-count" hidden></span></button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </header>

  <main id="start-page" class="start-page">
    <section class="start-content" aria-labelledby="start-heading">
      <div class="start-rule" aria-hidden="true"></div>
      <p class="eyebrow">NEW TAB</p>
      <h1 id="start-heading">Surge Browser</h1>
      <p class="start-description">An open space for your next destination.</p>
      <form id="start-form" class="start-form" role="search" aria-label="New tab search">
        <label class="visually-hidden" for="start-address">Enter an address or search</label>
        <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
        <input id="start-address" type="text" placeholder="Enter an address or search" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
        <button id="start-go" type="submit" disabled>Go <svg class="icon" aria-hidden="true"><use href="#icon-forward"/></svg></button>
      </form>
      <p class="keyboard-hint"><kbd>Ctrl</kbd> + <kbd>L</kbd> Address bar <span aria-hidden="true">/</span> <kbd>Ctrl</kbd> + <kbd>T</kbd> New tab</p>
    </section>
  </main>

  <template id="tab-template">
    <div class="tab" role="presentation">
      <button class="tab-select" type="button" role="tab" aria-selected="false" tabindex="-1"><span class="tab-loading" aria-hidden="true"></span><span class="tab-title"></span></button>
      <button class="tab-close icon-button" type="button" aria-label="Close tab"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
    </div>
  </template>
</body>
</html>
