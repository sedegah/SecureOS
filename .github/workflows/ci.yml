name: Surge CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: surge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-tests:
    name: Updater unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check updater JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/update-service.cjs

      - name: Run updater tests
        run: node --test tests/updater.test.cjs

      - name: Run lock screen credential tests
        run: node --test tests/lock.test.mjs
